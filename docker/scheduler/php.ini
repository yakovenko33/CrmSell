[PHP]
; Performance settings for Scheduler
memory_limit = 256M
max_execution_time = 300
max_input_vars = 5000
max_input_time = 60

; Timezone
date.timezone = UTC

; Error reporting for scheduler
display_errors = Off
log_errors = On
error_log = /var/log/scheduler_errors.log

; Security
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; Realpath cache
realpath_cache_size = 4096k
realpath_cache_ttl = 600

; MySQL settings
mysql.default_port = 3306
mysql.default_host = mysql

; mysqli settings
mysqli.default_port = 3306
mysqli.default_host = mysql
mysqli.reconnect = On
